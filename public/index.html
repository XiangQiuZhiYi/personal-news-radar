<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f2e9" />
    <meta name="description" content="由 Codex 筛选的个人每日信息晚报" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <title>信息晚报</title>
  </head>
  <body>
    <header class="hero">
      <p class="eyebrow">PERSONAL NEWS RADAR</p>
      <h1>信息晚报</h1>
      <div class="refresh-row">
        <button id="refresh-button" class="refresh-button" type="button">获取最新消息</button>
        <span id="refresh-status" class="refresh-status" aria-live="polite">仅成功整理后进入 30 分钟冷却。</span>
      </div>
      <p id="brief-label" class="brief-label">最近一次整理概览</p>
      <p id="brief" class="brief">正在读取今天的精选信息……</p>
      <div id="stats" class="stats"></div>
      <section id="speech-controls" class="speech-controls" aria-label="语音播报控制">
        <div class="speech-actions">
          <button id="speech-play" class="speech-button primary" type="button">播放当前内容</button>
          <button id="speech-pause" class="speech-button" type="button" disabled>暂停</button>
          <button id="speech-stop" class="speech-button" type="button" disabled>停止</button>
          <label class="speech-rate">
            <span>语速</span>
            <select id="speech-rate" aria-label="语音播报速度">
              <option value="0.8">0.8×</option>
              <option value="1" selected>1.0×</option>
              <option value="1.15">1.15×</option>
              <option value="1.25">1.25×</option>
            </select>
          </label>
        </div>
        <span id="speech-status" class="speech-status" aria-live="polite">准备播放</span>
      </section>
    </header>

    <main>
      <nav id="views" class="view-tabs" aria-label="内容视图">
        <button class="view-tab active" type="button" data-view="today">今日累计</button>
        <button class="view-tab" type="button" data-view="history">历史记录</button>
      </nav>
      <section id="errors" class="errors" hidden>
        <span id="error-message"></span>
        <button id="error-close" type="button" aria-label="关闭错误提示">关闭</button>
      </section>
      <section id="history-browser" class="history-browser" hidden>
        <h2>按日期查看</h2>
        <div id="history-list" class="history-list"></div>
      </section>
      <section id="digest-panel">
        <nav id="filters" class="filters" aria-label="主题筛选"></nav>
        <section id="feed" class="feed" aria-live="polite"></section>
      </section>
    </main>

    <footer>
      <span id="updated-at"></span>
      <span>摘要由 Codex 辅助生成，请以原文为准。</span>
    </footer>
    <script type="module" src="./app.js"></script>
  </body>
</html>
